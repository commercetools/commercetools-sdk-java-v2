        strictly "[5.4.4,5.99999]"
        prefer "5.6.2"
    }

    api 'commons-io:commons-io:2.22.0' version {
        strictly '[2.8.0,)'
        prefer '2.22.0'
    }

    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
}
